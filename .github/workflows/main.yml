name: Build WSL2 Kernel with F2FS and EROFS

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main, master, linux-msft-wsl-6.6.y ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernel-branch: [linux-msft-wsl-6.6.y]  # 可以添加其他分支

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.kernel-branch }}
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential flex bison dwarves libssl-dev libelf-dev \
          cpio qemu-utils bc kmod python3 python3-pip
        pip3 install construct

    - name: Configure kernel
      run: |
        cp Microsoft/config-wsl .config
        # 启用 F2FS 支持
        echo "CONFIG_F2FS_FS=y" >> .config
        echo "CONFIG_F2FS_STAT_FS=y" >> .config
        echo "CONFIG_F2FS_FS_XATTR=y" >> .config
        echo "CONFIG_F2FS_FS_POSIX_ACL=y" >> .config
        echo "CONFIG_F2FS_FS_SECURITY=y" >> .config
        echo "CONFIG_F2FS_CHECK_FS=y" >> .config
        echo "CONFIG_F2FS_FS_COMPRESSION=y" >> .config
        
        # 启用 EROFS 支持（编译进内核）
        echo "CONFIG_EROFS_FS=y" >> .config
        echo "CONFIG_EROFS_FS_XATTR=y" >> .config
        echo "CONFIG_EROFS_FS_POSIX_ACL=y" >> .config
        echo "CONFIG_EROFS_FS_SECURITY=y" >> .config
        echo "CONFIG_EROFS_FS_ZIP=y" >> .config
        echo "CONFIG_EROFS_FS_ZSTD=y" >> .config
        echo "CONFIG_EROFS_FS_LZ4=y" >> .config
        
        # 更新配置
        make olddefconfig

    - name: Build kernel
      run: |
        # 获取核心数用于并行编译
        nproc=$(nproc)
        echo "Building with $nproc cores"
        make -j$nproc bzImage
        make -j$nproc modules

    - name: Prepare kernel artifacts
      run: |
        mkdir -p kernel_artifacts
        # 复制内核镜像
        cp arch/x86/boot/bzImage kernel_artifacts/
        # 复制模块
        INSTALL_MOD_PATH="$PWD/modules_install" make modules_install
        cd modules_install
        tar czf ../kernel_artifacts/modules.tar.gz .
        cd ..
        
        # 创建版本信息
        echo "Kernel: $(make -s kernelrelease)" > kernel_artifacts/version.txt
        echo "Branch: ${{ matrix.kernel-branch }}" >> kernel_artifacts/version.txt
        echo "Build date: $(date)" >> kernel_artifacts/version.txt
        echo "F2FS Support: Enabled (CONFIG_F2FS_FS=y)" >> kernel_artifacts/version.txt
        echo "EROFS Support: Enabled (CONFIG_EROFS_FS=y)" >> kernel_artifacts/version.txt

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wsl2-kernel-f2fs-erofs-${{ matrix.kernel-branch }}
        path: kernel_artifacts/
        retention-days: 30

    - name: Create release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          kernel_artifacts/bzImage
          kernel_artifacts/modules.tar.gz
          kernel_artifacts/version.txt
        generate_release_notes: true
